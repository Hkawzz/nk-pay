# CI: em todo Pull Request e em todo push na main, compila o app e roda os testes.
# Se este workflow falhar, o PR não deve ser juntado: a main precisa sempre compilar.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Instalar a plataforma Android 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null

      - name: Testes (domínio, banco e interface) + capturas de tela
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true --console=plain

      - name: Guardar as capturas de tela
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-de-tela
          path: app/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --console=plain

      # O APK de debug é um app separado (com.nkpay.app.debug, ADR 0007): serve para
      # testar a versão nova no celular com uma CÓPIA dos dados, sem tocar no app principal.
      - name: Guardar o APK de debug
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Guardar relatório dos testes se algo falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          retention-days: 7
