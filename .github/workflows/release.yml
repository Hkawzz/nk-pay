# Release: ao criar uma tag v* (ex.: v0.1.0), compila o APK de release,
# assina com a keystore guardada nos GitHub Secrets e publica uma GitHub Release
# com o arquivo nk-pay-vX.Y.Z.apk e as notas tiradas do CHANGELOG.md.
#
# Segurança: este workflow FALHA se a keystore não estiver configurada.
# Ele nunca publica um APK sem assinatura ou assinado com a chave de debug,
# porque isso impediria atualizar o app sem desinstalar (e perder os dados).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar APK assinado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Ler a versão da tag
        id: versao
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag '$GITHUB_REF_NAME' não segue o formato vX.Y.Z"
            exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

      - name: Extrair as notas do CHANGELOG.md
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          # Pega o texto entre "## [X.Y.Z]" e o próximo "## [".
          awk -v v="$VERSAO" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::O CHANGELOG.md não tem uma seção '## [$VERSAO]'. Escreva as notas antes de criar a tag."
            exit 1
          fi
          cat notas.md

      - name: Conferir se a keystore está configurada
        env:
          KS: ${{ secrets.NKPAY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NKPAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NKPAY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NKPAY_KEY_PASSWORD }}
        run: |
          for nome in KS KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!nome}" ]; then
              echo "::error::Secret ausente ($nome). Configure os NKPAY_* em Settings → Secrets."
              exit 1
            fi
          done

      - name: Decodificar a keystore (arquivo temporário, fora do repositório)
        env:
          KS: ${{ secrets.NKPAY_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/nk-pay-release.jks"

      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Instalar a plataforma Android 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Testes e APK de release assinado
        env:
          NKPAY_KEYSTORE_FILE: ${{ runner.temp }}/nk-pay-release.jks
          NKPAY_KEYSTORE_PASSWORD: ${{ secrets.NKPAY_KEYSTORE_PASSWORD }}
          NKPAY_KEY_ALIAS: ${{ secrets.NKPAY_KEY_ALIAS }}
          NKPAY_KEY_PASSWORD: ${{ secrets.NKPAY_KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          -PnkpayVersion=${{ steps.versao.outputs.versao }}

      - name: Verificar a assinatura e renomear o APK
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::APK assinado não encontrado (assinatura falhou?)"; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee assinatura.txt
          # Proteção extra: nunca publicar com a chave de debug do Android.
          if grep -qi "CN=Android Debug" assinatura.txt; then
            echo "::error::O APK foi assinado com a chave de DEBUG. Abortando."
            exit 1
          fi
          # A assinatura precisa ser EXATAMENTE a da keystore oficial (impressão
          # digital SHA-256 do certificado; não é segredo). Se os Secrets forem
          # trocados por outra chave, a Release falha em vez de publicar um APK
          # que não instalaria por cima do app atual.
          ESPERADA="e408563d272ef960f75617f92da848c9948bebedb66b9371143a299fe9b2fc64"
          if ! grep -q "certificate SHA-256 digest: $ESPERADA" assinatura.txt; then
            echo "::error::A impressão digital do certificado não é a da keystore oficial. Abortando."
            exit 1
          fi
          mv "$APK" "nk-pay-v$VERSAO.apk"

      - name: Criar a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: >
          gh release create "$GITHUB_REF_NAME" "nk-pay-v$VERSAO.apk"
          --title "NK Pay v$VERSAO"
          --notes-file notas.md

      - name: Apagar a keystore temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/nk-pay-release.jks"
